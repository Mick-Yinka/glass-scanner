<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#136132"><title>Glass Scanner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071b10;color:#fff}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 15%,rgba(37,132,76,.35),transparent 35%),radial-gradient(circle at 80% 75%,rgba(19,97,50,.4),transparent 40%),#071b10}.head{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:3}.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:2px}.close{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;width:40px;height:40px;font-size:18px}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 24px;position:relative}.cam{width:min(94vw,560px);aspect-ratio:3/4;max-height:67vh;position:relative;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 20px 80px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14)}video{width:100%;height:100%;object-fit:cover;display:block}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 25%,transparent 75%,rgba(0,0,0,.45));pointer-events:none}.scanbox{position:absolute;left:8%;right:8%;top:36%;height:28%;border:2px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.28),0 0 28px rgba(97,214,132,.35);pointer-events:none}.scanbox:before,.scanbox:after{content:"";position:absolute;width:34px;height:34px;border-color:#5fe08a}.scanbox:before{left:-2px;top:-2px;border-left:4px solid;border-top:4px solid;border-radius:16px 0 0 0}.scanbox:after{right:-2px;bottom:-2px;border-right:4px solid;border-bottom:4px solid;border-radius:0 0 16px 0}.beam{position:absolute;left:10%;right:10%;height:2px;top:39%;background:linear-gradient(90deg,transparent,#75f09e,transparent);box-shadow:0 0 15px #75f09e;animation:scan 2.2s linear infinite}@keyframes scan{0%{transform:translateY(0);opacity:.35}50%{transform:translateY(150px);opacity:1}100%{transform:translateY(0);opacity:.35}}.status{width:min(94vw,560px);text-align:center;margin:14px 0 8px;font-size:14px;min-height:42px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)}.status b{color:#fff}.controls{display:flex;gap:10px;width:min(94vw,560px)}button{font:inherit;cursor:pointer}.btn{flex:1;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700}.btn.primary{background:#136132;border-color:#4fc879;box-shadow:0 8px 30px rgba(19,97,50,.35)}.btn:disabled{opacity:.5}.hint{font-size:11px;text-align:center;opacity:.58;margin-top:10px}.found{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:4}.found.on{display:flex}.card{width:min(88vw,420px);background:#fff;color:#15301f;border-radius:22px;padding:24px;box-shadow:0 25px 90px rgba(0,0,0,.5);text-align:center}.check{font-size:40px;color:#136132}.code{font-size:26px;font-weight:900;letter-spacing:1px;margin:8px 0 4px;word-break:break-word}.sub{font-size:12px;color:#607064}.row{display:flex;gap:9px;margin-top:18px}.row .btn{color:#15301f;background:#f2f5f3;border-color:#dce5df}.row .primary{color:#fff;background:#136132;border-color:#136132}</style></head><body><div class="app"><div class="head"><div class="brand">Glass Inspection<small>Live Camera Scanner</small></div><button class="close" id="close" aria-label="Close">×</button></div><div class="stage"><div class="cam"><video id="video" autoplay playsinline muted></video><div class="shade"></div><div class="scanbox"></div><i class="beam"></i><div class="found" id="found"><div class="card"><div class="check">✓</div><div class="code" id="foundCode"></div><div class="sub" id="foundType">Detected</div><div class="row"><button class="btn" id="again">Scan again</button><button class="btn primary" id="use">Use code</button></div></div></div></div><div class="status" id="status">Starting camera…</div><div class="controls"><button class="btn" id="photo">Use photo instead</button><button class="btn primary" id="stop">Close scanner</button></div><div class="hint">Keep the printed code or text inside the box. Plain text recognition is prioritised.</div><input id="file" type="file" accept="image/*" capture="environment" hidden></div></div><script>const Q=s=>document.querySelector(s),V=Q('#video'),ST=Q('#status'),F=Q('#found'),FC=Q('#foundCode'),FT=Q('#foundType'),FILE=Q('#file');let stream=null,reader=null,worker=null,running=true,busy=false,last='',hits=0,mode='';const sleep=m=>new Promise(r=>setTimeout(r,m));function setStatus(t){ST.textContent=t}function load(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Scanner library could not load'));document.head.appendChild(s)})}async function initLibs(){if(!window.ZXingBrowser)await load('https://unpkg.com/@zxing/browser@0.1.5');if(!window.Tesseract)await load('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');reader=new ZXingBrowser.BrowserMultiFormatReader();worker=await Tesseract.createWorker('eng',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:'https://tessdata.projectnaptha.com/4.0.0'});await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ./-_'});setStatus('Camera ready — point at the printed glass code or label.')}async function startCamera(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Camera is unavailable in this browser');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});V.srcObject=stream;await V.play();await initLibs();startBarcode();ocrLoop()}catch(e){setStatus('Camera could not start: '+e.message);Q('#photo').disabled=false}}function startBarcode(){if(!reader)return;try{reader.decodeFromVideoDevice(null,V,(r,e)=>{if(r&&running){const t=r.getText();if(t)accept(t,'QR/barcode')}})}catch(e){setStatus('Barcode reader unavailable; plain-text scanning is still active.')}}async function ocrLoop(){while(running){if(!busy&&V.videoWidth&&V.videoHeight&&worker){busy=true;try{const w=V.videoWidth,h=V.videoHeight,c=document.createElement('canvas');const sw=w*.9,sh=h*.34,sx=w*.05,sy=h*.33,k=Math.min(1,1400/sw);c.width=Math.round(sw*k);c.height=Math.round(sh*k);const x=c.getContext('2d');x.drawImage(V,sx,sy,sw,sh,0,0,c.width,c.height);const r=await worker.recognize(c);const t=String(r.data.text||'').replace(/\s+/g,' ').trim();if(t)accept(t,'Plain text')}catch(e){}busy=false}await sleep(850)}}function accept(text,type){if(!running)return;const t=String(text||'').replace(/\s+/g,' ').trim();if(!t)return;if(t===last)hits++;else{last=t;hits=1}if(type!=='Plain text'||hits>=2){running=false;FC.textContent=t.slice(0,120);FT.textContent=type;F.classList.add('on');stopCamera()}else setStatus('Text found: '+t.slice(0,60)+' — hold steady…')}function stopCamera(){try{if(reader)reader.reset()}catch(e){}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}V.srcObject=null}function send(){const p=new URLSearchParams(location.search),token=p.get('token')||'';const code=FC.textContent.trim();if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'GLASS_SCAN_RESULT',token:token,code:code,source:'Glass Scanner'},'*');window.close()}else{navigator.clipboard?.writeText(code).catch(()=>{});setStatus('Code detected: '+code)}}function closeAll(){running=false;stopCamera();if(window.opener&&!window.opener.closed)window.close();else history.back()}Q('#use').onclick=send;Q('#again').onclick=()=>{F.classList.remove('on');last='';hits=0;running=true;startCamera()};Q('#close').onclick=closeAll;Q('#stop').onclick=closeAll;Q('#photo').onclick=()=>FILE.click();FILE.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;running=false;stopCamera();F.classList.remove('on');setStatus('Reading photo…');try{const u=URL.createObjectURL(f),im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=u});const c=document.createElement('canvas'),k=Math.min(1,1800/im.width);c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const r=await worker.recognize(c);const t=String(r.data.text||'').replace(/\s+/g,' ').trim();URL.revokeObjectURL(u);if(t)accept(t,'Plain text photo');else setStatus('No readable text found. Try another photo.')}catch(e){setStatus('Could not read that photo.')}};startCamera();</script></body></html>
